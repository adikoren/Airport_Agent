# Region name -> US states. Source: US Census Bureau, "Census Regions and Divisions of the United States".
# Names with no official definition ("West Coast", "Sun Belt", ...) are deliberately absent:
# the agent asks the user which states they mean.

# Names meaning the whole country (all US airports in the data, including territories).
national: [United States, US, USA, U.S., U.S.A., US states, US airports, America, nationwide, national, the country, all airports, all US airports, everywhere]

# Words ignored when matching a region name ("Pacific division", "New England region", "the Midwest states").
ignore_words: [division, region, area, states, state, airports, the, of, us]

divisions:
  New England: [CT, ME, MA, NH, RI, VT]
  Middle Atlantic: [NJ, NY, PA]
  East North Central: [IL, IN, MI, OH, WI]
  West North Central: [IA, KS, MN, MO, NE, ND, SD]
  South Atlantic: [DE, DC, FL, GA, MD, NC, SC, VA, WV]
  East South Central: [AL, KY, MS, TN]
  West South Central: [AR, LA, OK, TX]
  Mountain: [AZ, CO, ID, MT, NV, NM, UT, WY]
  Pacific: [AK, CA, HI, OR, WA]

regions:
  Northeast: [New England, Middle Atlantic]
  Midwest: [East North Central, West North Central]
  South: [South Atlantic, East South Central, West South Central]
  West: [Mountain, Pacific]


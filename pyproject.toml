[project]
name = "airport-agent"
version = "0.1.0"
description = "Airport Investment Intelligence Agent"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: end-to-end tests that call the real Claude (run with RUN_LIVE_E2E=1)"]
filterwarnings = ["ignore:Session-scoped fixtures defined as instance methods:DeprecationWarning", "ignore::pytest.PytestRemovedIn10Warning"]
